      <stop offset="50%" stop-color="#81d4fa" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#ce93d8" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="280" fill="url(#sky)"/>
