<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" preserveAspectRatio="xMidYMax meet">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1040" stop-opacity="0"/>
      <stop offset="55%" stop-color="#0c1838" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#061018" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="bld" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e2a48"/>
      <stop offset="100%" stop-color="#070c18"/>
