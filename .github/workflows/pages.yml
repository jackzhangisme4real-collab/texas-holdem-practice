name: Configure GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  configure:
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.try.outputs.mode }}
    steps:
      - name: Publish from main branch root
        id: try
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repo="${GITHUB_REPOSITORY}"
          payload='{"build_type":"legacy","source":{"branch":"main","path":"/"}}'
          tmp="$(mktemp)"
          code="$(curl -sS -o "$tmp" -w "%{http_code}" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${repo}/pages")"
          echo "GET /pages -> ${code}"
          if [ "$code" = "200" ]; then
            method="PUT"
          elif [ "$code" = "404" ]; then
            method="POST"
          else
            cat "$tmp"
            exit 1
          fi
          out="$(mktemp)"
          status="$(curl -sS -o "$out" -w "%{http_code}" \
            -X "$method" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/json" \
            -d "$payload" \
            "https://api.github.com/repos/${repo}/pages")"
          echo "${method} /pages -> ${status}"
          cat "$out"
          echo
          if [ "$status" = "200" ] || [ "$status" = "201" ]; then
            echo "mode=legacy" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Workflow token often lacks the admin scope for the legacy source API.
          if [ "$status" = "403" ] || [ "$status" = "401" ]; then
            echo "mode=actions" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          exit 1

  deploy:
    needs: configure
    if: needs.configure.outputs.mode == 'actions'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Stage static site
        run: |
          mkdir -p _site
          cp -a index.html README.md .nojekyll css js assets _site/
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
